name: Deploy To Production
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOKCER_PASSWORD }}
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/movie-reservation-backend:latest ./server
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/movie-reservation-frontend:latest ./client
      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/movie-reservation-backend:latest
      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/movie-reservation-frontend:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          scripts: |
            cd movie-reservation
            docker compose -f docker-compose.prod.yml pull 
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

